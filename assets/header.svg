<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigBlur"><feGaussianBlur stdDeviation="30"/></filter>
    <pattern id="hex" x="0" y="0" width="42" height="36" patternUnits="userSpaceOnUse">
      <polygon points="21,0 42,10 42,26 21,36 0,26 0,10" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.35"/>
    </pattern>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bgGrad)"/>
  <rect width="1200" height="260" fill="url(#hex)"/>

  <circle cx="200" cy="130" r="80" fill="#7c3aed" opacity="0.15" filter="url(#bigBlur)">
    <animate attributeName="cx" values="200;280;200" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="130;90;130" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.22;0.15" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="130" r="100" fill="#06b6d4" opacity="0.10" filter="url(#bigBlur)">
    <animate attributeName="cx" values="1000;920;1000" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="130;170;130" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.10;0.18;0.10" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="40" r="50" fill="#a78bfa" opacity="0.08" filter="url(#bigBlur)">
    <animate attributeName="cx" values="600;680;600" dur="13s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.08;0.14;0.08" dur="13s" repeatCount="indefinite"/>
  </circle>

  <rect x="0" y="0" width="1200" height="1" fill="#06b6d4" opacity="0">
    <animate attributeName="y" values="0;260;0" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="7s" repeatCount="indefinite"/>
  </rect>

  <circle cx="120" cy="220" r="1.5" fill="#06b6d4">
    <animate attributeName="cy" values="220;30;220" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="200" r="1" fill="#a78bfa">
    <animate attributeName="cy" values="200;15;200" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="240" r="2" fill="#06b6d4">
    <animate attributeName="cy" values="240;40;240" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="660" cy="210" r="1" fill="#7c3aed">
    <animate attributeName="cy" values="210;20;210" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="840" cy="230" r="1.5" fill="#06b6d4">
    <animate attributeName="cy" values="230;35;230" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1020" cy="200" r="1" fill="#a78bfa">
    <animate attributeName="cy" values="200;10;200" dur="7.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="7.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1140" cy="220" r="1.5" fill="#06b6d4">
    <animate attributeName="cy" values="220;30;220" dur="6.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="6.5s" repeatCount="indefinite"/>
  </circle>

  <text x="600" y="125" text-anchor="middle" font-family="monospace" font-size="46" font-weight="bold" fill="#e6edf3" filter="url(#glow)" letter-spacing="2">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
    houjunyi2005
  </text>

  <text x="600" y="160" text-anchor="middle" font-family="monospace" font-size="14" fill="#8b949e" opacity="0.9">
    🚧 Professional bug producer  ·  ⚡ Powered by caffeine  ·  🐍 Building things that matter
  </text>

  <rect x="0" y="258" width="1200" height="2" fill="url(#borderGrad)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
